name: جودة المشروع

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
      - name: إعداد pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: تثبيت الاعتماديات
        run: pnpm install --frozen-lockfile
      - name: فحص الأنواع
        run: pnpm check
      - name: الاختبارات
        run: pnpm test
      - name: فحص lint
        run: pnpm lint
